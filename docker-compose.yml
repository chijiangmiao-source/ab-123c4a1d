services:
  web:
    build: .
    image: ioco-quiescence-verify:latest
    environment:
      IOCO_HOST: "0.0.0.0"
      IOCO_PORT: "8080"
    # 宿主机开放端口可通过 .env / 环境变量 IOCO_PORT 配置，默认 8080
    ports:
      - "${IOCO_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 一次性核对服务：代码测试 -> 构建检查 -> HTTP 冒烟（静默后报警反例）
  # 完成即退出，退出码即核对结论（0 通过 / 非 0 失败）。
  # 查看：docker compose up --build verify；docker compose ps -a
  verify:
    image: ioco-quiescence-verify:latest
    build: .
    command: ["python", "verify/verify.py"]
    environment:
      IOCO_WEB_URL: "http://web:8080"
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
